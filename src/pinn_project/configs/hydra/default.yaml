# Hydra run directories and file logging shared by all entrypoints.
defaults:
  # Color both Hydra's own messages and application job logs consistently.
  - override hydra_logging: colorlog
  - override job_logging: colorlog

run:
  # Timestamped directory for one job.
  dir: ${paths.log_dir}/${task_name}/runs/${now:%Y-%m-%d}_${now:%H-%M-%S}
sweep:
  # A multirun shares one timestamped root and assigns each job its Hydra index.
  dir: ${paths.log_dir}/${task_name}/multiruns/${now:%Y-%m-%d}_${now:%H-%M-%S}
  subdir: ${hydra.job.num}
job:
  # Keep relative paths anchored to the directory from which the entrypoint was launched.
  chdir: false
  env_set:
    # JAX otherwise reserves 75% of GPU memory during backend initialization, which can fail on shared/display GPUs.
    XLA_PYTHON_CLIENT_PREALLOCATE: "false"
job_logging:
  # Keep application lifecycle messages while suppressing verbose backend and Orbax implementation details.
  loggers:
    jax:
      level: WARNING
    absl:
      level: WARNING
    orbax:
      level: WARNING
    # Preserve concise checkpoint lifecycle records in the run log without interrupting Rich's live terminal display.
    phijax.callbacks.model_checkpoint:
      level: INFO
      handlers:
        - file
      propagate: false
  handlers:
    file:
      # Use the configured task name when available, otherwise Hydra's config name.
      filename: ${hydra.runtime.output_dir}/${oc.select:task_name,${hydra:job.config_name}}.log
