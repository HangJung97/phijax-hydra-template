_target_: phijax.training.WandbLogger
# W&B project receiving configuration, scalar metrics, and checkpoint artifacts.
project: phijax
# Local W&B cache directory for this Hydra run.
save_dir: ${paths.output_dir}
# Optional team/account; `null` uses the SDK's configured default entity.
entity: null
# Human-readable run name shown in the W&B interface.
name: ${task_name}
# Stable W&B identifier for resumption; `null` creates a new run.
run_id: null
# Optional grouping and job metadata used to organize related runs.
group: null
job_type: train
# Root experiment labels stay independent of logger selection and are forwarded when W&B is enabled.
tags: ${tags}
# `online`, `offline`, or `disabled`, as accepted by `wandb.init`.
mode: online
# W&B resume policy; when `run_id` is set and this is `null`, PhiJAX uses `allow`.
resume: null
# Default W&B artifact type assigned to logged checkpoint paths.
artifact_type: model
