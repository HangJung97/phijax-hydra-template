# Sum named mean-squared residual terms while preserving their individual loss streams.
_target_: phijax.objectives.CompositeObjective
terms:
  initial:
    _target_: phijax.objectives.ResidualTerm
    # Stable scalar metric/balancer name aligned with the single returned residual group.
    names: [initial/u]
    # Route `batches["initial"]` to this equation function.
    batch_key: initial
    # Exact-NTK balancing differentiates raw selected model outputs for supervised fidelity.
    ntk_stream: output
    residual_fn:
      _target_: phijax.equations.base_data_fidelity
      # Build a callable awaiting `(model_apply, model_state, batch, stream)` rather than invoking it at composition.
      _partial_: true
      # Compare predicted output column 0 with target column 0.
      output_indices: [0]
      target_indices: [0]
  pde:
    _target_: phijax.objectives.ResidualTerm
    # The equation declares local residual name `burgers`; the term prefixes it with `batch_key` as `pde/burgers`.
    batch_key: pde
    # Differentiate the physical PDE residual for exact-NTK diagnostics.
    ntk_stream: residual
    residual_fn:
      _target_: phijax.equations.burgers_1d
      _partial_: true
      # Kinematic viscosity `0.01 / pi` in the configured nondimensional equation.
      viscosity_coefficient: ${op:truediv,0.01,${math:pi}}
      # Network output column representing the scalar solution `u`.
      output_index: 0
