# This defaults list composes the reusable network, objective, balancer, schedule, and optimizer groups.
defaults:
  - module: phi_module
  - net: mlp
  - objective: burgers_1d
  - balancer: grad_norm
  - scheduler: warmup_exp_decay
  - optimizer: adamw
  - _self_

net:
  # Burgers coordinates are ordered `[t, x]` and the single output is `u`.
  input_dim: 2
  output_dim: 1
  output_names: [u]
  # Three fully connected hidden layers with smooth activations for coordinate derivatives.
  hidden: [256, 256, 256]
  activation: tanh
  # Replace spatial coordinate index 1 with `(cos(pi*x), sin(pi*x))` for period 2.
  periodic_features: true
  periodic_features_kwargs:
    axes: [1]
    frequencies:
      - ${math:pi}
  # Apply a trainable random Fourier mapping after the fixed periodic embedding.
  fourier_features: true
  fourier_features_kwargs:
    embed_dim: 128
    scale: 2.0
  # Keep physical coordinates unnormalized because periodic features encode the known spatial scale.
  input_norm: false
