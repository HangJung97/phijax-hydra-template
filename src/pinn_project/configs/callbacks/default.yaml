# Compose the standard callback suite. Select an individual file with `callbacks=<name>` when only one is needed.
defaults:
  - temporal_curriculum
  - lr_monitor
  - rich_model_summary
  - rich_progress_bar
  - model_checkpoint
  - early_stopping
  - prediction_writer
  - _self_

# Prediction writing belongs to the standard callback namespace and is instantiated only when post-fit prediction is
# requested. The same trainer can therefore reuse its in-memory state without rebuilding a prediction experiment.
prediction_writer:
  enabled: ${oc.select:predict,false}
  output_dir: ${paths.output_dir}/predictions
  save_file_name: ${oc.select:data.name,predictions}
