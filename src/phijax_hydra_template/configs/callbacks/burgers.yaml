# Reference callback policy for the complete Burgers experiment.
defaults:
  - lr_monitor
  - rich_model_summary
  - rich_progress_bar
  - model_checkpoint
  - prediction_writer
  - _self_

model_checkpoint:
  # Persist ten evenly spaced periodic states during the reference run.
  every_n_steps: 1000
  # Keep only the two most recent checkpoints to bound disk usage.
  save_top_k: 2

prediction_writer:
  output_dir: ${paths.output_dir}/predictions
  save_file_name: ${oc.select:data.name,predictions}
