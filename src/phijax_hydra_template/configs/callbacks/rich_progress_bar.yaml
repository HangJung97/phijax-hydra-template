rich_progress_bar:
  # Display training progress and automatically discovered loss/weight metrics.
  _target_: phijax.callbacks.RichProgressBar
  # The bar counts to `trainer.max_steps`; this interpolation keeps its refresh interval aligned with logging.
  refresh_rate: ${trainer.log_every_n_steps}
  description: Step
  predict_description: Predicting
  # `false` keeps the completed bar visible after fitting.
  transient: false
  rank_zero_only: true
