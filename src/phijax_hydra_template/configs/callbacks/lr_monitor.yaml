lr_monitor:
  _target_: phijax.callbacks.LearningRateMonitor
  # The selected model scheduler is instantiated independently as the same pure step-indexed function.
  schedule: ${oc.select:model.scheduler,null}
  # Derive a stable display name from the selected Optax target; this logs `optimizer/lr-adamw` by default.
  optimizer_name: ${target.name:${model.optimizer._target_}}
  # Optax transformations are functional, so optional optimizer statistics are supplied from configuration.
  momentum: ${oc.select:model.optimizer.b1,${oc.select:model.optimizer.momentum,0.0}}
  weight_decay: ${oc.select:model.optimizer.weight_decay,0.0}
  log_momentum: false
  log_weight_decay: false
  log_key_prefix: optimizer/
  # `null` follows `trainer.log_every_n_steps`; alternatives are `step` and `epoch`.
  logging_interval: null
