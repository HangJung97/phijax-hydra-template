_target_: optax.warmup_exponential_decay_schedule
# Linearly warm from zero to the peak learning rate over the first 10% of training.
init_value: 0.0
peak_value: 1.0e-3
warmup_steps: ${op:floordiv,${trainer.max_steps},10}
# Decay once over the remaining steps, so training ends at `peak_value * decay_rate` instead of near the peak.
transition_steps: ${op:sub,${trainer.max_steps},${.warmup_steps}}
# Final learning rate at `trainer.max_steps` as a fraction of `peak_value`.
decay_rate: 0.01
# `false` applies continuous exponential interpolation; `true` uses discrete steps.
staircase: false
