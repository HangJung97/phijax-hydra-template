_target_: optax.warmup_exponential_decay_schedule
# Linearly warm from zero to the peak learning rate over the initial optimizer updates.
init_value: 0.0
peak_value: 1.0e-3
warmup_steps: 2000
# Optimizer steps per multiplicative decay transition after warmup.
transition_steps: 2000
# Multiply the learning rate by this factor after each transition interval.
decay_rate: 0.9
# `false` applies continuous exponential interpolation; `true` uses discrete steps.
staircase: false
