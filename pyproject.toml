[project]
name = "phijax-hydra-template"
version = "0.1.0"
description = "A Hydra project template for reproducible PhiJAX PINN experiments."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
  "hydra-colorlog==1.2.0",
  "hydra-optuna-sweeper>=1.2.0,<2",
  "matplotlib>=3.10,<4",
  "phijax==0.2.0b4",
  "scipy>=1.17,<2",
]

[project.urls]
Repository = "https://github.com/HangJung97/phijax-hydra-template"
PhiJAX = "https://github.com/HangJung97/PhiJAX"

[project.scripts]
phijax-evaluate = "phijax_hydra_template.evaluate_predictions:main"
phijax-predict = "phijax_hydra_template.predict:main"
phijax-train = "phijax_hydra_template.train:main"

[project.optional-dependencies]
# Install at most one accelerator extra.
cuda12 = ["phijax[cuda12]==0.2.0b4"]
cuda13 = ["phijax[cuda13]==0.2.0b4"]
tpu = ["phijax[tpu]==0.2.0b4"]
# Interactive environment for running and validating the included notebook.
jupyter = ["ipykernel>=7,<8", "jupyterlab>=4,<5", "nbconvert>=7,<8"]
tensorboard = ["phijax[tensorboard]==0.2.0b4"]
wandb = ["phijax[wandb]==0.2.0b4"]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[dependency-groups]
# Install this group for the complete local development environment.
dev = [
  "pre-commit>=4,<5",
  { include-group = "lint" },
  { include-group = "test" },
]
lint = ["docformatter>=1.7.5,<2", "pyright>=1.1.405,<2", "ruff>=0.16,<0.17"]
test = ["pytest>=9,<10", "pytest-cov>=7,<8"]

[tool.uv]
required-version = ">=0.12,<0.13"
# JAX accelerator plugins cannot be installed together in one environment.
conflicts = [[{ extra = "cuda12" }, { extra = "cuda13" }, { extra = "tpu" }]]

[tool.uv.build-backend]
module-name = "phijax_hydra_template"

[tool.pytest.ini_options]
addopts = [
  "--color=yes",
  "--durations=10",
]
filterwarnings = [
  # Ignore third-party Orbax deprecations while keeping PhiJAX deprecations visible.
  "ignore:.*deprecated.*:DeprecationWarning:orbax.*",
]
log_cli = true
markers = [
  "gpu: tests that require at least one JAX-visible GPU device",
  "slow: slow tests",
]
minversion = "9.0"
testpaths = ["tests"]

[tool.pyright]
# Type-check the project package and tests.
include = ["src/phijax_hydra_template", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
venv = ".venv"
venvPath = "."

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
# Rule families: https://docs.astral.sh/ruff/rules/
select = [
  "A",    # flake8-builtins
  "ANN",  # flake8-annotations
  "B",    # flake8-bugbear
  "C4",   # flake8-comprehensions
  "D",    # pydocstyle
  "E",    # pycodestyle errors
  "F",    # Pyflakes
  "I",    # isort
  "N",    # pep8-naming
  "PERF", # Perflint
  "PIE",  # flake8-pie
  "PT",   # flake8-pytest-style
  "RUF",  # Ruff-specific rules
  "S",    # flake8-bandit
  "SIM",  # flake8-simplify
  "UP",   # pyupgrade
  "W",    # pycodestyle warnings
]
ignore = [
  "ANN401", # Allow `Any` at generic JAX PyTree and extension boundaries.
  "D100",   # The template does not require module-level docstrings.
  "D104",   # The template does not require package-level docstrings.
  "S101",   # Pytest uses assertions for test expectations.
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.docformatter]
recursive = true
wrap-summaries = 120
wrap-descriptions = 120
