[project]
name = "pinn-project"
version = "0.1.0"
description = "A Hydra project template for reproducible PhiJAX PINN experiments."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
  "hydra-colorlog==1.2.0",
  "matplotlib>=3.10,<4",
  "phijax==0.1.0b1",
  "rootutils>=1.0.7,<2",
  "scipy>=1.17,<2",
]

[project.scripts]
pinn-evaluate = "pinn_project.evaluate_predictions:main"
pinn-predict = "pinn_project.predict:main"
pinn-train = "pinn_project.train:main"

[project.optional-dependencies]
cuda12 = ["phijax[cuda12]==0.1.0b1"]
cuda13 = ["phijax[cuda13]==0.1.0b1"]
tensorboard = ["phijax[tensorboard]==0.1.0b1"]
wandb = ["phijax[wandb]==0.1.0b1"]

[build-system]
requires = ["uv_build>=0.11,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
  "pre-commit>=4,<5",
  { include-group = "lint" },
  { include-group = "test" },
]
docs = ["mkdocs>=1.6,<2", "mkdocs-material>=9,<10"]
lint = ["docformatter>=1.7.5,<2", "pyright>=1.1.405,<2", "ruff>=0.16,<0.17"]
test = ["pytest>=9,<10", "pytest-cov>=7,<8"]

[tool.uv]
required-version = ">=0.12,<0.13"
conflicts = [[{ extra = "cuda12" }, { extra = "cuda13" }]]

[tool.pytest.ini_options]
addopts = ["--color=yes", "--durations=10"]
filterwarnings = ["ignore:.*deprecated.*:DeprecationWarning:orbax.*"]
testpaths = ["tests"]

[tool.pyright]
include = ["src/pinn_project", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["A", "ANN", "B", "C4", "D", "E", "F", "I", "N", "PERF", "PIE", "PT", "RUF", "S", "SIM", "UP", "W"]
ignore = ["ANN401", "D100", "D104", "S101"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.docformatter]
recursive = true
wrap-summaries = 120
wrap-descriptions = 120
